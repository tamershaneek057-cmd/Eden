<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <p class="eyebrow">Eden</p>
        <h1>Type a message and watch it echo back.</h1>

        <form id="form" novalidate>
          <label class="sr-only" for="input">Message</label>
          <input id="input" name="message" type="text" placeholder="Type here" autocomplete="off" />
          <button type="submit">Run</button>
        </form>

        <p id="status" class="status" aria-live="polite">Ready.</p>
        <pre id="out" aria-live="polite">No message yet.</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
